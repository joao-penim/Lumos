name: Feature request
description: Suggest an idea for Lumos
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I play X, I have to…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lumos to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, other apps that do this well, screenshots…
