<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tray icon, HDR active: simplified Lumos mark (dynamic-range ring + spark), no background tile. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="0.5" stop-color="#ffd34e"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd34e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="132 19" transform="rotate(-200 32 32)"/>
  <path d="M32 12 C32.8 24 40 31.2 52 32 C40 32.8 32.8 40 32 52 C31.2 40 24 32.8 12 32 C24 31.2 31.2 24 32 12 Z"
        fill="url(#spark)" stroke="#b86a00" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
</svg>
